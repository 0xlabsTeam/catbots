# Copy this file to your Catbots data directory as local.env.yaml, then replace all placeholders.
profile:
  name: My local profile
  telemetry: false

llm:
  provider: openai-compatible
  base_url: https://api.example.com/v1
  api_key: replace-me
  model: provider/model
  # Optional for OpenAI-compatible reasoning models: none, low, medium, or high.
  # LM Studio Qwen tool workflows should use none to reserve output for tool calls.
  reasoning_effort: none

exchanges:
  hyperliquid:
    network: testnet
    account_address: "0x0000000000000000000000000000000000000000"
    agent_private_key: replace-me
